name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install what ui-gif records with
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm install --prefix "$HOME/.cache/officina/ui-gif" --save-exact --ignore-scripts --no-audit --no-fund playwright-core@1.64.1
      - run: node --test tests/*.test.mjs
