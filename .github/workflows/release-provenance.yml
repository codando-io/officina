# Attaches a source archive to each published release, with a signed build
# provenance attestation. Verify with:
#   gh attestation verify officina-<version>.tar.gz -R codando-io/officina
name: release-provenance
on:
  release:
    types: [published]
permissions: {}
jobs:
  attest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Build the source archive
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: git archive --format=tar.gz --prefix="officina-${TAG#v}/" -o "officina-${TAG#v}.tar.gz" HEAD
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: officina-*.tar.gz
      - name: Attach the archive to the release
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" officina-*.tar.gz --clobber
